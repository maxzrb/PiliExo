org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter Gradle 插件当前仍依赖 AGP 旧 DSL/外部 Kotlin 兼容模式；删除这两个开关
# 会在配置阶段触发 ApplicationExtension 与 AbstractAppExtension 类型冲突。
android.builtInKotlin=false
android.newDsl=false
# 项目 build 目录位于 D 盘，而部分 Flutter 插件源码通常位于 C 盘；关闭 Kotlin
# 增量编译可避免增量缓存计算跨盘相对路径失败，保证本地和 CI 构建行为一致。
kotlin.incremental=false
